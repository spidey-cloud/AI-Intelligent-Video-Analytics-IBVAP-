name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # sim-detector test path needs httpx (TestClient) and pytest
          pip install pytest httpx

      - name: Run test suite (sim detector, isolated temp DB)
        env:
          IBVAP_DETECTOR: sim
          IBVAP_YOLO_MODEL: models/none.pt
        run: python -m pytest tests/ -q

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m compileall -q backend tests scripts
          echo "compileall OK"
