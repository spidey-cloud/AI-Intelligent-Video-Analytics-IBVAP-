<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1240" height="800" fill="#f8fafc"/>
  <text x="40" y="36" font-size="18" font-weight="700" fill="#0f172a">IBVAP — Logical Architecture &amp; Component Inventory</text>
  <text x="40" y="58" font-size="12" fill="#64748b">Six layers; every module is a pluggable function of (frame, tracks, config) → result</text>

  <!-- L1 -->
  <rect x="40" y="84" width="1000" height="100" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="56" y="106" font-size="11.5" font-weight="700" fill="#0369a1" letter-spacing="1">L1 · EDGE &amp; SOURCES (EXISTING)</text>
  <g>
    <rect x="60" y="118" width="280" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="74" y="139" font-size="12.5" font-weight="700" fill="#0f172a">IP CCTV cameras (RTSP / H.264)</text>
    <text x="74" y="157" font-size="10.5" fill="#64748b">no replacement · no gateways</text>
    <rect x="360" y="118" width="280" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="374" y="139" font-size="12.5" font-weight="700" fill="#0f172a">NVR / DVR</text>
    <text x="374" y="157" font-size="10.5" fill="#64748b">continuous recording (unchanged)</text>
    <rect x="660" y="118" width="280" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="674" y="139" font-size="12.5" font-weight="700" fill="#0f172a">Recorded footage</text>
    <text x="674" y="157" font-size="10.5" fill="#64748b">detector tuning · ANPR clip library</text>
  </g>
  <line x1="540" y1="184" x2="540" y2="196" stroke="#475569" marker-end="url(#arr)"/>

  <!-- L2 -->
  <rect x="40" y="196" width="1000" height="100" rx="12" fill="#dbeafe" stroke="#2563eb"/>
  <text x="56" y="218" font-size="11.5" font-weight="700" fill="#1d4ed8" letter-spacing="1">L2 · INGESTION</text>
  <g>
    <rect x="60" y="230" width="236" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="74" y="251" font-size="12.5" font-weight="700" fill="#0f172a">Stream Manager</text>
    <text x="74" y="269" font-size="10.5" fill="#64748b">pool · auto-reconnect · 1-frame buffer</text>
    <rect x="312" y="230" width="236" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="326" y="251" font-size="12.5" font-weight="700" fill="#0f172a">Frame Sampler</text>
    <text x="326" y="269" font-size="10.5" fill="#64748b">3–5 fps per camera (jitter-tolerant)</text>
    <rect x="564" y="230" width="236" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="578" y="251" font-size="12.5" font-weight="700" fill="#0f172a">Motion Gate</text>
    <text x="578" y="269" font-size="10.5" fill="#64748b">frame differencing · skips static scenes</text>
    <rect x="816" y="230" width="204" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="830" y="251" font-size="12.5" font-weight="700" fill="#0f172a">Adaptive Resolver</text>
    <text x="830" y="269" font-size="10.5" fill="#64748b">640 px max edge · portrait-safe</text>
  </g>
  <line x1="540" y1="296" x2="540" y2="308" stroke="#475569" marker-end="url(#arr)"/>

  <!-- L3 -->
  <rect x="40" y="308" width="1000" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="56" y="330" font-size="11.5" font-weight="700" fill="#6d28d9" letter-spacing="1">L3 · AI ANALYTICS (CPU-ONLY)</text>
  <g>
    <rect x="60" y="342" width="200" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="74" y="363" font-size="12.5" font-weight="700" fill="#0f172a">Detector</text>
    <text x="74" y="381" font-size="10.5" fill="#64748b">YOLO-n INT8 · SSD fallback</text>
    <rect x="276" y="342" width="200" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="290" y="363" font-size="12.5" font-weight="700" fill="#0f172a">Tracker</text>
    <text x="290" y="381" font-size="10.5" fill="#64748b">IoU + expiry · BoT-SORT option</text>
    <rect x="492" y="342" width="240" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="506" y="363" font-size="12.5" font-weight="700" fill="#0f172a">Activity Rules</text>
    <text x="506" y="381" font-size="10.5" fill="#64748b">intrusion · loitering · abandoned · crossing</text>
    <rect x="748" y="342" width="136" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="762" y="363" font-size="12.5" font-weight="700" fill="#0f172a">ANPR</text>
    <text x="762" y="381" font-size="10.5" fill="#64748b">plate OCR (PaddleOCR)</text>
    <rect x="896" y="342" width="124" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="910" y="363" font-size="12.5" font-weight="700" fill="#0f172a">Face</text>
    <text x="910" y="381" font-size="10.5" fill="#64748b">watchlist kNN</text>
  </g>
  <line x1="540" y1="408" x2="540" y2="420" stroke="#475569" marker-end="url(#arr)"/>

  <!-- L4 -->
  <rect x="40" y="420" width="1000" height="100" rx="12" fill="#fef3c7" stroke="#d97706"/>
  <text x="56" y="442" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="1">L4 · EVENT &amp; ALERT ENGINE</text>
  <g>
    <rect x="60" y="454" width="220" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="74" y="475" font-size="12.5" font-weight="700" fill="#0f172a">Rule Engine</text>
    <text x="74" y="493" font-size="10.5" fill="#64748b">fire · dedup · per-track×zone cooldown</text>
    <rect x="296" y="454" width="220" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="310" y="475" font-size="12.5" font-weight="700" fill="#0f172a">Event Store</text>
    <text x="310" y="493" font-size="10.5" fill="#64748b">active → ack → closed · immutable</text>
    <rect x="532" y="454" width="236" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="546" y="475" font-size="12.5" font-weight="700" fill="#0f172a">Evidence Clip Recorder</text>
    <text x="546" y="493" font-size="10.5" fill="#64748b">ring buffer → 20 s MP4 (10 s pre/post)</text>
    <rect x="784" y="454" width="236" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="798" y="475" font-size="12.5" font-weight="700" fill="#0f172a">Alert Router</text>
    <text x="798" y="493" font-size="10.5" fill="#64748b">WS hub · SMS gateway · C2 webhook</text>
  </g>
  <line x1="540" y1="520" x2="540" y2="532" stroke="#475569" marker-end="url(#arr)"/>

  <!-- L5 -->
  <rect x="40" y="532" width="1000" height="100" rx="12" fill="#dcfce7" stroke="#16a34a"/>
  <text x="56" y="554" font-size="11.5" font-weight="700" fill="#15803d" letter-spacing="1">L5 · DATA</text>
  <g>
    <rect x="60" y="566" width="300" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="74" y="587" font-size="12.5" font-weight="700" fill="#0f172a">PostgreSQL</text>
    <text x="74" y="605" font-size="10.5" fill="#64748b">events · zones · users · audit (SQLite in pilot)</text>
    <rect x="380" y="566" width="300" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="394" y="587" font-size="12.5" font-weight="700" fill="#0f172a">Object Store</text>
    <text x="394" y="605" font-size="10.5" fill="#64748b">clips · snapshots (existing NAS/SAN or MinIO)</text>
    <rect x="700" y="566" width="320" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="714" y="587" font-size="12.5" font-weight="700" fill="#0f172a">Model Store</text>
    <text x="714" y="605" font-size="10.5" fill="#64748b">versioned weights · hash-verified at deploy</text>
  </g>
  <line x1="540" y1="632" x2="540" y2="644" stroke="#475569" marker-end="url(#arr)"/>

  <!-- L6 -->
  <rect x="40" y="644" width="1000" height="100" rx="12" fill="#fce7f3" stroke="#db2777"/>
  <text x="56" y="666" font-size="11.5" font-weight="700" fill="#be185d" letter-spacing="1">L6 · INTERFACE</text>
  <g>
    <rect x="60" y="678" width="180" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="74" y="699" font-size="12.5" font-weight="700" fill="#0f172a">REST API</text>
    <text x="74" y="717" font-size="10.5" fill="#64748b">JWT · C2 integrations</text>
    <rect x="256" y="678" width="180" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="270" y="699" font-size="12.5" font-weight="700" fill="#0f172a">WebSocket Hub</text>
    <text x="270" y="717" font-size="10.5" fill="#64748b">real-time alerts · poll fallback</text>
    <rect x="452" y="678" width="200" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="466" y="699" font-size="12.5" font-weight="700" fill="#0f172a">Web Dashboard</text>
    <text x="466" y="717" font-size="10.5" fill="#64748b">live wall · events · zone editor</text>
    <rect x="668" y="678" width="180" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="682" y="699" font-size="12.5" font-weight="700" fill="#0f172a">Mobile UI</text>
    <text x="682" y="717" font-size="10.5" fill="#64748b">responsive · field app later</text>
    <rect x="864" y="678" width="146" height="52" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="878" y="699" font-size="12.5" font-weight="700" fill="#0f172a">Admin</text>
    <text x="878" y="717" font-size="10.5" fill="#64748b">users · RBAC</text>
  </g>

  <!-- cross-cutting -->
  <rect x="1064" y="84" width="136" height="660" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="6 4"/>
  <text transform="translate(1132,414) rotate(-90)" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">CROSS-CUTTING · JWT + RBAC · AUDIT LOG · OBSERVABILITY · TLS</text>

  <text x="40" y="776" font-size="11" fill="#64748b">Reference implementation: backend/{sources,detection,events,alerts,db,main}.py — one module per component above.</text>
</svg>
